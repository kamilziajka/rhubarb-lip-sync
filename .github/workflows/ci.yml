name: Build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - description: macOS - Xcode
            os: macos-15-intel
            cmakeOptions: '-D CMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
            publish: true
    env:
      BOOST_ROOT: ${{ github.workspace }}/lib/boost
      BOOST_URL: https://sourceforge.net/projects/boost/files/boost/1.86.0/boost_1_86_0.tar.bz2/download
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Restore Boost from cache
        uses: actions/cache@v4
        id: cache-boost
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ env.BOOST_URL }}
      - name: Download Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            # use forward slashes only
            BOOST_ROOT=$(echo $BOOST_ROOT | sed 's/\\/\//g')
          fi
          mkdir -p $BOOST_ROOT
          curl --insecure -L $BOOST_URL | tar -xj --strip-components=1 -C $BOOST_ROOT
      - name: Install Java 11 on macOS
        if: ${{ runner.os == 'macOS' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Build Rhubarb
        shell: bash
        run: |
          JAVA_HOME=${JAVA_HOME_11_X64:-${JAVA_HOME_11_arm64:-$JAVA_HOME}}
          mkdir -p extras/EsotericSoftwareSpine/build/libs
          mkdir build
          cd build
          cmake ${{ matrix.cmakeOptions }} -D CMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON ..
          cmake --build . --config Release --target rhubarb runTests
          cmake --build . --config Release --target package
      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./build/rhubarb/Release/runTests.exe
          else
            ./build/rhubarb/runTests
          fi
      - name: Check that the macOS binary is universal
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          mkdir package-check
          unzip -q build/*.zip -d package-check
          BINARY=$(find package-check -type f -name rhubarb -perm -u+x)
          lipo -info "$BINARY"
          lipo "$BINARY" -verify_arch arm64
          lipo "$BINARY" -verify_arch x86_64
      - name: Upload artifacts
        if: ${{ matrix.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.description }}
          path: build/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout changelog
        uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
      - name: Extract changelog data
        run: |
          # Store the release name in env.releaseName
          HEADER=$(awk '/^## / {sub(/^## /, ""); print; exit}' CHANGELOG.md)
          echo "releaseName=$HEADER" >> $GITHUB_ENV

          # Store the changelog body in changes.txt
          awk '/^## / {if (found) exit; found=1; next} found' CHANGELOG.md > changes.txt
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ env.releaseName }}
          body_path: changes.txt
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
